name: Deploy to itch.io

on:
  push:
    branches: [release]

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -p /root/.local/share/godot/export_templates/4.6.1.stable
        env:
          HOME: /root

      - name: Write Talo settings
        run: |
          cat > addons/talo/settings.cfg <<'EOF'
          access_key="${{ secrets.TALO_ACCESS_KEY }}"
          api_url="https://api.heeyagames.com"
          socket_url="wss://api.heeyagames.com"
          auto_connect_socket=true
          handle_tree_quit=true

          [player_auth]
          auto_start_session=false
          EOF

      - name: Web build
        run: |
          mkdir -v -p build/web
          godot --headless --export-release "Web" build/web/index.html
        env:
          HOME: /root

      - name: Deploy to itch.io
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: html
          ITCH_GAME: escape-to-marty
          ITCH_USER: lostpoet999
          PACKAGE: build/web
